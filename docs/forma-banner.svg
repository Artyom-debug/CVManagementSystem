<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Forma</title>
  <desc id="desc">A profile and a position converge into a publishable CV.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101216"/>
      <stop offset="1" stop-color="#20242b"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#b8d6d2"/>
      <stop offset="1" stop-color="#d8d2bb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="328" rx="21" fill="none" stroke="#373c44"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="58" y="65" width="55" height="55" rx="14" fill="#e9e8e3"/>
    <text x="76" y="106" font-size="49" font-style="italic" font-weight="700" fill="#121417">f</text>
    <text x="132" y="108" font-size="58" font-weight="700" letter-spacing="-4" fill="#f2f1ed">forma.</text>
    <text x="62" y="159" font-size="19" fill="#a6abb1">Profiles, positions, and CVs in one workspace.</text>
    <line x1="62" y1="204" x2="522" y2="204" stroke="#555c64"/>
    <text x="62" y="239" font-size="15" letter-spacing="2" fill="#9fa8a7">BUILD  ·  MATCH  ·  PUBLISH</text>
  </g>
  <g fill="none" stroke="#667773" stroke-width="2">
    <path d="M845 112 H910 Q927 112 927 129 V144"/>
    <path d="M845 239 H910 Q927 239 927 222 V206"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="650" y="72" width="195" height="80" rx="12" fill="#2c3538" stroke="#62726d"/>
    <circle cx="677" cy="99" r="9" fill="#b8d6d2"/>
    <text x="696" y="105" font-size="16" font-weight="700" fill="#f2f1ed">Profile</text>
    <text x="673" y="133" font-size="13" fill="#aeb9b6">Values + projects</text>
    <rect x="650" y="199" width="195" height="80" rx="12" fill="#36342f" stroke="#8b816c"/>
    <rect x="668" y="224" width="18" height="18" rx="4" fill="#d8d2bb"/>
    <text x="696" y="233" font-size="16" font-weight="700" fill="#f2f1ed">Position</text>
    <text x="673" y="260" font-size="13" fill="#c1bbae">Template + access</text>
    <rect x="927" y="143" width="211" height="64" rx="14" fill="url(#accent)"/>
    <text x="951" y="173" font-size="21" font-weight="700" fill="#182022">CV</text>
    <text x="951" y="192" font-size="13" fill="#394744">Ready to publish</text>
  </g>
</svg>
